[project]
name = "Comfy-IndexTTSLocalAPI"
version = "1.0.4"
description = "ComfyUI node for local IndexTTS: multi-role, multi-emotion script dubbing with frame-accurate subtitles"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["requests"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/lingdle/Comfy-IndexTTSLocalAPI"
Documentation = "https://github.com/lingdle/Comfy-IndexTTSLocalAPI#readme"
"Bug Tracker" = "https://github.com/lingdle/Comfy-IndexTTSLocalAPI/issues"

[tool.comfy]
PublisherId = "lingdle"
DisplayName = "Comfy-IndexTTSLocalAPI"
Icon = "https://raw.githubusercontent.com/lingdle/Comfy-IndexTTSLocalAPI/main/assets/icon.svg"
Banner = "https://raw.githubusercontent.com/lingdle/Comfy-IndexTTSLocalAPI/main/assets/banner.svg"
